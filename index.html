    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease-out;
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen video {
        max-width: 80vw;
        max-height: 80vh;
        -o-object-fit: contain;
           object-fit: contain;
      }
      #splash-logo {
        width: 120px;
        height: 120px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
    </style>
    <script type="module" crossorigin src="/koog-site/assets/main-BKlmESUo.js"></script>
    <link rel="stylesheet" crossorigin href="/koog-site/assets/main-C3xZeFq-.css">
  <link rel="manifest" href="/koog-site/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/koog-site/registerSW.js"></script></head>
  <body>
    <div id="splash-screen">
      <video id="splash-video" autoplay muted playsinline>
        <source src="/koog-site/logo-animation.mp4" type="video/mp4">
      </video>
      <svg id="splash-logo" style="display: none;" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#E61919" stroke-width="2"/>
        <text x="50" y="58" text-anchor="middle" fill="white" font-size="24" font-weight="bold">K</text>
      </svg>
    </div>
    <div id="root"></div>
    <script>
      (function() {
        const splash = document.getElementById('splash-screen');
        const video = document.getElementById('splash-video');
        const fallbackLogo = document.getElementById('splash-logo');
        const ua = navigator.userAgent;
        
        // 精确检测浏览器类型
        const isWeChat = /MicroMessenger/i.test(ua);
        const isQQ = /QQ\//i.test(ua) || /Qzone/i.test(ua);
        const isWeibo = /Weibo/i.test(ua);
        const isDouyin = /aweme|douyin/i.test(ua);
        const isInAppBrowser = isWeChat || isQQ || isWeibo || isDouyin;
        
        // Safari 和 Chrome 强制使用 MP4
        const isSafari = /^((?!chrome|android).)*safari/i.test(ua) && !isInAppBrowser;
        const isChrome = /Chrome/i.test(ua) && !/Edge|Edg|OPR|Opera/i.test(ua) && !isInAppBrowser;
        const isModernBrowser = isSafari || isChrome || /Firefox/i.test(ua) || /Edge/i.test(ua);
        
        // 强制使用视频的现代浏览器列表
        const forceVideo = isModernBrowser && !isInAppBrowser;
        
        console.log('[Splash] UA:', ua.substring(0, 100));
        console.log('[Splash] isWeChat:', isWeChat, 'isInApp:', isInAppBrowser, 'forceVideo:', forceVideo);
        
        function hideSplash() {
          splash.classList.add('hidden');
          setTimeout(() => splash.remove(), 500);
        }
        
        // 仅在真正的微信/内置浏览器中使用SVG回退
        if (isInAppBrowser && !forceVideo) {
          console.log('[Splash] Using SVG fallback for in-app browser');
          video.style.display = 'none';
          fallbackLogo.style.display = 'block';
          setTimeout(hideSplash, 2000);
        } else {
          // Safari/Chrome/现代浏览器：强制使用MP4视频
          console.log('[Splash] Using MP4 video for modern browser');
          
          // 确保视频元素可见并尝试播放
          video.style.display = 'block';
          fallbackLogo.style.display = 'none';
          
          // 尝试自动播放
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(function(error) {
              console.log('[Splash] Autoplay blocked:', error);
              // 自动播放被阻止，显示回退
              video.style.display = 'none';
              fallbackLogo.style.display = 'block';
              setTimeout(hideSplash, 2000);
            });
          }
          
          video.addEventListener('canplaythrough', () => {
            console.log('[Splash] Video can play through');
            video.style.display = 'block';
            fallbackLogo.style.display = 'none';
          });
          
          video.addEventListener('ended', () => {
            console.log('[Splash] Video ended');
            hideSplash();
          });
          
          video.addEventListener('error', (e) => {
            console.log('[Splash] Video error:', e);
            video.style.display = 'none';
            fallbackLogo.style.display = 'block';
            setTimeout(hideSplash, 2000);
          });
          
          //  Safeguard: 4秒后无论如何都隐藏启动屏
          setTimeout(hideSplash, 4000);
        }
        
        if (window.netlifyIdentity) {
          window.netlifyIdentity.on("init", user => {
            if (!user) {
              window.netlifyIdentity.on("login", () => {
                document.location.href = "/admin/";
              });
            }
          });
        }
      })();
    </script>
  </body>
