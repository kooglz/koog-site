    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease-out;
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen video {
        max-width: 80vw;
        max-height: 80vh;
        -o-object-fit: contain;
           object-fit: contain;
      }
      #splash-logo {
        width: 120px;
        height: 120px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
    </style>
    <script type="module" crossorigin src="/koog-site/assets/main-BKlmESUo.js"></script>
    <link rel="stylesheet" crossorigin href="/koog-site/assets/main-C3xZeFq-.css">
  <link rel="manifest" href="/koog-site/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/koog-site/registerSW.js"></script></head>
  <body>
    <div id="splash-screen">
      <video id="splash-video" autoplay muted playsinline>
        <source src="/koog-site/logo-animation.mp4" type="video/mp4">
      </video>
      <svg id="splash-logo" style="display: none;" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#E61919" stroke-width="2"/>
        <text x="50" y="58" text-anchor="middle" fill="white" font-size="24" font-weight="bold">K</text>
      </svg>
    </div>
    <div id="root"></div>
    <script>
      const splash = document.getElementById('splash-screen');
      const video = document.getElementById('splash-video');
      const fallbackLogo = document.getElementById('splash-logo');
      
      // WeChat / in-app browsers block autoplay — show fallback logo immediately
      var isWeChat = /MicroMessenger/i.test(navigator.userAgent);
      var isInApp = /WeChat|QQ|weibo|douyin|migu/i.test(navigator.userAgent);
      
      if (isWeChat || isInApp) {
        // Skip video entirely in WeChat and other in-app browsers
        video.style.display = 'none';
        fallbackLogo.style.display = 'block';
        setTimeout(hideSplash, 2000);
      } else {
        video.addEventListener('canplaythrough', () => {
          video.style.display = 'block';
          fallbackLogo.style.display = 'none';
        });
        
        video.addEventListener('ended', hideSplash);
        video.addEventListener('error', () => {
          video.style.display = 'none';
          fallbackLogo.style.display = 'block';
          setTimeout(hideSplash, 2000);
        });
        
        // Fallback: if video doesn't start within 2s, show logo
        setTimeout(() => {
          if (video.readyState < 3) {
            video.style.display = 'none';
            fallbackLogo.style.display = 'block';
            setTimeout(hideSplash, 1500);
          }
        }, 2000);
      }
      
      function hideSplash() {
        splash.classList.add('hidden');
        setTimeout(() => splash.remove(), 500);
      }
      
      setTimeout(hideSplash, 4000);
      
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
