    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@koogdesign" />
    <meta name="twitter:title" content="KOOG DESIGN - 创意设计工作室" />
    <meta name="twitter:description" content="专业插画设计与品牌视觉解决方案" />
    <meta name="twitter:image" content="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KOOG" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <title>KOOG DESIGN</title>
    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease-out;
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash-screen video {
        max-width: 80vw;
        max-height: 80vh;
        object-fit: contain;
      }
      #splash-logo {
        width: 120px;
        height: 120px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <video id="splash-video" autoplay muted playsinline>
        <source src="/logo-animation.mp4" type="video/mp4">
      </video>
      <svg id="splash-logo" style="display: none;" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#E61919" stroke-width="2"/>
        <text x="50" y="58" text-anchor="middle" fill="white" font-size="24" font-weight="bold">K</text>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const splash = document.getElementById('splash-screen');
      const video = document.getElementById('splash-video');
      const fallbackLogo = document.getElementById('splash-logo');
      
      video.addEventListener('canplaythrough', () => {
        video.style.display = 'block';
        fallbackLogo.style.display = 'none';
      });
      
      video.addEventListener('ended', hideSplash);
      video.addEventListener('error', () => {
        video.style.display = 'none';
        fallbackLogo.style.display = 'block';
        setTimeout(hideSplash, 2000);
      });
      
      function hideSplash() {
        splash.classList.add('hidden');
        setTimeout(() => splash.remove(), 500);
      }
      
      setTimeout(hideSplash, 4000);
      
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
