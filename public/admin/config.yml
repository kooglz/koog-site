backend:
  name: git-gateway
  branch: main

# Local backend for development (when running locally)
local_backend:
  url: http://127.0.0.1:8081/api/v1
  allowed_hosts: [localhost, 127.0.0.1]
locale: zh_Hans
site_url: https://www.koogdesign.top
display_url: http://localhost:5173
logo:
  src: /new-logo.png
  show_in_header: true
media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 86
  strip_metadata: true
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

media_folder: "public/works"
public_folder: "/works"

collections:
  - name: "content"
    label: "网站内容"
    files:
      - name: "site_general"
        label: "全局设置 (导航/首页/页脚)"
        file: "public/content/site.json"
        description: "图片会在浏览器内先压缩，再保存到本地；同步上线时上传压缩后的文件。Logo 与二维码保留原格式。"
        fields:
          - {label: "网站 Logo", name: "logo", widget: "image", media_processing: {enabled: true, strip_metadata: true}, media_library: {config: {max_file_size: 12582912}}, hint: "建议：高度 80-120px，保留原格式与透明通道。"}
          - label: "导航栏 (Navigation)"
            name: "nav"
            widget: "object"
            fields:
              - {label: "首页 (中)", name: "home_cn", widget: "string"}
              - {label: "作品 (中)", name: "works_cn", widget: "string"}
              - {label: "咨询合作 (中)", name: "inquiry_cn", widget: "string"}
              - {label: "首页 (英)", name: "home_en", widget: "string"}
              - {label: "作品 (英)", name: "works_en", widget: "string"}
              - {label: "咨询合作 (英)", name: "inquiry_en", widget: "string"}
          - label: "首页首屏 (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - {label: "标签 (中)", name: "tag_cn", widget: "string"}
              - {label: "大标题1 (中)", name: "title1_cn", widget: "string"}
              - {label: "大标题2 (中)", name: "title2_cn", widget: "string"}
              - {label: "描述 (中)", name: "desc_cn", widget: "text"}
              - {label: "按钮文字 (中)", name: "cta_cn", widget: "string"}
              - {label: "旋转印章文字 (中)", name: "stamp_cn", widget: "string"}
              - {label: "标签 (英)", name: "tag_en", widget: "string"}
              - {label: "大标题1 (英)", name: "title1_en", widget: "string"}
              - {label: "大标题2 (英)", name: "title2_en", widget: "string"}
              - {label: "描述 (英)", name: "desc_en", widget: "text"}
              - {label: "按钮文字 (英)", name: "cta_en", widget: "string"}
              - {label: "旋转印章文字 (英)", name: "stamp_en", widget: "string"}
          - label: "页脚 (Footer)"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Slogan (中)", name: "tagline_cn", widget: "text"}
              - {label: "Slogan (英)", name: "tagline_en", widget: "text"}
              - {label: "CTA标题 (中)", name: "cta_cn", widget: "string"}
              - {label: "CTA标题 (英)", name: "cta_en", widget: "string"}
              - {label: "邮箱", name: "email", widget: "string"}
              - {label: "微信 ID", name: "wechatID", widget: "string"}
              - {label: "微信二维码", name: "wechatQR", widget: "image", media_processing: {enabled: true, strip_metadata: true}, media_library: {config: {max_file_size: 12582912}}, hint: "建议：400x400px，优先 PNG，保留原格式。"}
              - {label: "小红书 ID", name: "xhsID", widget: "string"}
              - {label: "小红书二维码", name: "xhsQR", widget: "image", media_processing: {enabled: true, strip_metadata: true}, media_library: {config: {max_file_size: 12582912}}, hint: "建议：400x400px，优先 PNG，保留原格式。"}
              - {label: "地点 (中)", name: "location_cn", widget: "string"}
              - {label: "地点 (英)", name: "location_en", widget: "string"}

      - name: "works"
        label: "作品集与首页数据"
        file: "public/content/works.json"
        description: "上传 JPG、PNG、WebP 时先自动压缩为 WebP，再保存本地，透明通道与原图尺寸保留。GIF 保留动画。预览确认后同步上线。"
        fields:
          - label: "首页轮播图 (Hero Images)"
            name: "hero_images"
            widget: "list"
            collapsed: true
            summary: "{{fields.alt}}"
            fields:
              - {label: "图片", name: "image", widget: "image", media_library: {config: {max_file_size: 12582912}}, hint: "3:4 竖版、宽 1200px 以上。自动压缩为 WebP 后保存，不裁切或放大。"}
              - {label: "描述 (Alt Text)", name: "alt", widget: "string", required: false}
              - {label: "描述 (英文)", name: "alt_en", widget: "string", required: false}
              - {label: "关联作品 ID", name: "project_id", widget: "string", required: false}
          
          - label: "作品列表 (Works)"
            name: "works"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - {label: "ID (唯一编号)", name: "id", widget: "string", hint: "使用稳定的英文短名，如 museum-series。项目分享链接依赖此编号，上线后请勿随意更改。", pattern: ["^[a-zA-Z0-9_-]+$", "请只用英文字母、数字、短横线或下划线"]}
              - {label: "标题", name: "title", widget: "string"}
              - {label: "标题 (英文)", name: "title_en", widget: "string", required: false}
              - {label: "分类", name: "category", widget: "string"}
              - {label: "分类 (英文)", name: "category_en", widget: "string", required: false}
              - {label: "委托方 (Client)", name: "client", widget: "string", required: false}
              - {label: "委托方 (Client) (英文)", name: "client_en", widget: "string", required: false}
              - {label: "年份", name: "year", widget: "string"}
              - {label: "封面图", name: "image", widget: "image", media_library: {config: {max_file_size: 12582912}}, hint: "建议 1200 × 1600px。先压缩为 WebP 再保存；卡片以 3:4 展示，详情保留原比例。"}
              - {label: "简短描述", name: "description", widget: "text"}
              - {label: "简短描述 (英文)", name: "description_en", widget: "text", required: false}
              - label: "详情页内容"
                name: "detail_content"
                widget: "object"
                fields:
                  - {label: "详细介绍", name: "full_desc", widget: "markdown"}
                  - {label: "详细介绍 (英文)", name: "full_desc_en", widget: "markdown", required: false}
                  - label: "作品详情图集"
                    name: "images"
                    widget: "list"
                    fields:
                      - {label: "图片", name: "url", widget: "image", media_library: {config: {max_file_size: 12582912}}, hint: "建议宽 1600px，原尺寸不裁切。JPG / PNG 先压缩为 WebP，保留透明；动画用 GIF，单张小于 12MB。"}
                      - {label: "图片描述 (无障碍文本)", name: "alt", widget: "string", required: false}
                      - {label: "图片描述 (英文)", name: "alt_en", widget: "string", required: false}
                      - {label: "展示高度 (像素，可选)", name: "height", widget: "number", required: false, value_type: "int", min: 1, hint: "用于预留加载空间，如 1400 或 1800；与图片真实高度一致。"}
